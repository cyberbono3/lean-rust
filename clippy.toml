# Clippy tunables for the lean-rust workspace.
#
# Lint *levels* live in Cargo.toml under [workspace.lints]; this file holds only
# the per-lint configuration knobs clippy reads from the workspace root.

# Identifiers `clippy::doc_markdown` (enabled via `pedantic`) must not flag as
# needing backticks. Consensus and cryptography vocabulary that recurs in prose
# throughout the workspace's doc comments.
#
# The `".."` entry is load-bearing: without it this list REPLACES clippy's
# built-in ident list rather than extending it, which would newly flag words the
# defaults already cover (KiB/MiB/GiB, TypeScript, OAuth, ...).
doc-valid-idents = [
    # splice in clippy's built-in defaults
    "..",
    # SSZ / merkleization
    "SSZ",
    "HTR",
    # consensus
    "LMD",
    "GHOST",
    "leanSpec",
    "leanSig",
    "leanMetrics",
    # cryptography
    "PQ",
    "OTS",
    # networking
    "P2P",
    "libp2p",
    "gossipsub",
    # encodings
    "YAML",
    "JSON",
]

# `dbg!` is a debugging aid rather than a defect inside test code. This keeps the
# door open to enabling `clippy::dbg_macro` later without churning tests.
allow-dbg-in-tests = true

# Byte threshold above which clippy's stack-size lints treat a value as large.
# The workspace routinely moves multi-KB SSZ payloads and 4000-byte signature
# placeholders across the stack.
too-large-for-stack = 128
