[package]
name          = "node"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description   = "Composition root wiring concrete runtime services into a Node."

[lints]
workspace = true

[dependencies]
runtime = { path = "../runtime" }
config      = { path = "../config" }
lean-wire   = { path = "../networking" }
protocol    = { path = "../protocol" }
storage     = { path = "../storage" }
types       = { path = "../types" }
anyhow      = { workspace = true }
async-trait = { workspace = true }
futures     = { workspace = true }
parking_lot = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }

[dev-dependencies]
# `runtime` is re-declared here ONLY to add the `test-fixtures` feature for test
# targets; `config` needed no such re-declaration (the `[dependencies]` entry
# already covers test targets), so it is not repeated.
runtime = { path = "../runtime", features = ["test-fixtures"] }
tokio      = { workspace = true, features = ["test-util"] }
tempfile   = { workspace = true }
